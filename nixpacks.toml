[phases.setup]
nixPkgs = ['nodejs-18_x', 'python312', 'python312Packages.pip']

[phases.install]
cmds = [
  'echo "=== Installing Node.js dependencies ==="',
  'cd frontend && npm ci || (echo "npm ci failed, trying npm install" && npm install)',
  'echo "=== Node.js dependencies installed ==="',
  'echo "=== Nixpacks will automatically install Python packages from requirements.txt ==="',
  'echo "=== Python packages will be installed in /opt/venv by Nixpacks ==="',
]

[phases.build]
cmds = [
  'echo "=== Frontend build start ==="',
  'cd frontend && npm run build',
  'echo "=== Frontend build complete ==="',
  'echo "=== Checking build output ==="',
  'pwd',
  'ls -la frontend/ || echo "frontend directory not found"',
  'ls -la frontend/dist || echo "frontend/dist directory not found"',
  'ls -la frontend/dist/index.html || echo "index.html not found"',
  'ls -la frontend/dist/assets || echo "assets directory not found"',
  'echo "=== Running Django migrations ==="',
  '/opt/venv/bin/python manage.py migrate --noinput 2>/dev/null || python3.12 manage.py migrate --noinput || python3 manage.py migrate --noinput || python manage.py migrate --noinput || (echo "WARNING: Migration failed, continuing..." && true)',
  'echo "=== Collecting static files ==="',
  '/opt/venv/bin/python manage.py collectstatic --noinput 2>/dev/null || python3.12 manage.py collectstatic --noinput || python3 manage.py collectstatic --noinput || python manage.py collectstatic --noinput || (echo "WARNING: Static file collection failed, continuing..." && true)',
  'echo "=== Build phase complete ==="',
]

# [phases.start]はProcfileを使用するため削除
# RailwayはProcfileを優先します
