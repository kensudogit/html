[phases.setup]
nixPkgs = ['nodejs-18_x', 'python312']

[phases.install]
cmds = [
  'echo "=== Installing Node.js dependencies ==="',
  'cd frontend && npm ci || (echo "npm ci failed, trying npm install" && npm install)',
  'echo "=== Node.js dependencies installed ==="',
  'echo "=== Installing Python dependencies ==="',
  'python3.12 -m ensurepip --upgrade --default-pip || python3 -m ensurepip --upgrade --default-pip || python -m ensurepip --upgrade --default-pip || echo "ensurepip failed, trying pip install"',
  'python3.12 -m pip install --upgrade pip setuptools wheel || python3 -m pip install --upgrade pip setuptools wheel || python -m pip install --upgrade pip setuptools wheel || echo "pip upgrade failed"',
  'python3.12 -m pip install -r requirements.txt || python3 -m pip install -r requirements.txt || python -m pip install -r requirements.txt || (echo "ERROR: pip install failed" && exit 1)',
  'echo "=== Verifying gunicorn installation ==="',
  'python3.12 -m pip show gunicorn && echo "gunicorn found via pip show" || python3 -m pip show gunicorn && echo "gunicorn found via pip show" || python -m pip show gunicorn && echo "gunicorn found via pip show" || (echo "ERROR: gunicorn not installed" && exit 1)',
  'python3.12 -m gunicorn --version && echo "gunicorn command works" || python3 -m gunicorn --version && echo "gunicorn command works" || python -m gunicorn --version && echo "gunicorn command works" || (echo "ERROR: gunicorn command not found" && exit 1)',
  'echo "=== Python dependencies installed successfully ==="',
]

[phases.build]
cmds = [
  'echo "=== Frontend build start ==="',
  'cd frontend && npm run build',
  'echo "=== Frontend build complete ==="',
  'echo "=== Checking build output ==="',
  'pwd',
  'ls -la frontend/ || echo "frontend directory not found"',
  'ls -la frontend/dist || echo "frontend/dist directory not found"',
  'ls -la frontend/dist/index.html || echo "index.html not found"',
  'ls -la frontend/dist/assets || echo "assets directory not found"',
  'echo "=== Nixpacks automatically installs pip when requirements.txt is detected ==="',
  'echo "=== Verifying Python ==="',
  'python3.12 --version || python3 --version || python --version || echo "Python not found"',
  'echo "=== Nixpacks will install Python packages automatically from requirements.txt ==="',
  'echo "=== Running Django migrations ==="',
  'python3.12 manage.py migrate --noinput || python3 manage.py migrate --noinput || python manage.py migrate --noinput || (echo "WARNING: Migration failed, continuing..." && true)',
  'echo "=== Collecting static files ==="',
  'python3.12 manage.py collectstatic --noinput || python3 manage.py collectstatic --noinput || python manage.py collectstatic --noinput || (echo "WARNING: Static file collection failed, continuing..." && true)',
  'echo "=== Build phase complete ==="',
]

# [phases.start]はProcfileを使用するため削除
# RailwayはProcfileを優先します
