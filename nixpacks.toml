[phases.setup]
nixPkgs = ['nodejs-18_x', 'python39', 'python39Packages.pip']

[phases.install]
cmds = [
  'cd frontend && npm ci',
]

[phases.build]
cmds = [
  'echo "=== Frontend build start ==="',
  'cd frontend && npm run build',
  'echo "=== Frontend build complete ==="',
  'echo "=== Checking build output ==="',
  'pwd',
  'ls -la frontend/ || echo "frontend directory not found"',
  'ls -la frontend/dist || echo "frontend/dist directory not found"',
  'ls -la frontend/dist/index.html || echo "index.html not found"',
  'ls -la frontend/dist/assets || echo "assets directory not found"',
  'echo "=== Installing Python dependencies ==="',
  'python --version || python3 --version || python3.9 --version || echo "Python not found"',
  'echo "=== Installing pip for Python 3.9 ==="',
  'python3.9 -m ensurepip --upgrade || python -m ensurepip --upgrade || python3 -m ensurepip --upgrade || echo "ensurepip failed, trying alternative methods"',
  'python3.9 -m pip --version || python -m pip --version || python3 -m pip --version || (echo "ERROR: pip not available" && exit 1)',
  'echo "=== Installing packages ==="',
  'python3.9 -m pip install --break-system-packages -r requirements.txt || python -m pip install --break-system-packages -r requirements.txt || python3 -m pip install --break-system-packages -r requirements.txt || (echo "ERROR: Failed to install Python packages" && exit 1)',
  'echo "=== Verifying Python packages ==="',
  'python3.9 -c "import yaml; print(\"PyYAML installed successfully\")" || python -c "import yaml; print(\"PyYAML installed successfully\")" || python3 -c "import yaml; print(\"PyYAML installed successfully\")" || (echo "ERROR: PyYAML not installed" && exit 1)',
  'python3.9 -c "import flask; print(\"Flask installed successfully\")" || python -c "import flask; print(\"Flask installed successfully\")" || python3 -c "import flask; print(\"Flask installed successfully\")" || (echo "ERROR: Flask not installed" && exit 1)',
  'python3.9 -c "import bs4; print(\"BeautifulSoup4 installed successfully\")" || python -c "import bs4; print(\"BeautifulSoup4 installed successfully\")" || python3 -c "import bs4; print(\"BeautifulSoup4 installed successfully\")" || (echo "ERROR: BeautifulSoup4 not installed" && exit 1)',
  'echo "=== Build phase complete ==="',
]

[phases.start]
cmd = 'python3.9 web_html_editor.py || python web_html_editor.py || python3 web_html_editor.py'
